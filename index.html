<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>sheep的小问题</title>
<style>
:root{--bg1:#fff3fa;--bg2:#f2f7ff;--pink:#ff7fb3;--pink2:#ffb8d2;--purple:#8c70ff;--text:#573f4f;--soft:#fff;--line:#f3dce7;--blue:#b8ddff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:linear-gradient(180deg,#fff8fc 0%,#f7fbff 42%,#fff3f9 100%);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:auto;pointer-events:none;z-index:0;border-radius:50%;filter:blur(18px);opacity:.45;animation:floatBlob 10s ease-in-out infinite}
body::before{width:230px;height:230px;left:-70px;top:70px;background:#ffd3e6}
body::after{width:250px;height:250px;right:-80px;bottom:90px;background:#d8ebff;animation-delay:-4s}
@keyframes floatBlob{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-22px) translateX(10px)}}
.stickers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sticker{position:absolute;font-size:20px;opacity:.52;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(15px) rotate(0deg);opacity:0}10%{opacity:.55}90%{opacity:.55}100%{transform:translateY(-110vh) rotate(30deg);opacity:0}}
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(100%,430px);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(236,153,191,.18);border-radius:28px;padding:18px 16px 18px;overflow:hidden;position:relative}
.badge{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff1f7;border:1px solid #ffd9e8;color:#cc5387;font-size:12px;font-weight:700;margin:0 auto 12px}
.top{display:flex;justify-content:center}
.frame{position:relative;width:100%;aspect-ratio:1/1;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#fff 0%,#fff7fb 100%);border:1px solid #f6e5ee;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
#heroImg,#endingImg{width:100%;height:100%;object-fit:contain;display:block;background:#fff;transition:transform .45s ease, opacity .35s ease}
.frame.pop img{transform:scale(1.015)}

#refuseImg,#overImg{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  display:block;
  background:#fff;
  transition:transform .45s ease,opacity .35s ease;
}

.title{text-align:center;font-size:28px;line-height:1.28;margin:16px 8px 8px;font-weight:800;letter-spacing:.3px}
.subtitle{text-align:center;color:#8c7483;font-size:14px;line-height:1.7;margin:0 10px 14px}
.buttons{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.btn{border:0;border-radius:18px;padding:15px 16px;font-size:17px;font-weight:800;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;box-shadow:0 9px 18px rgba(255,127,179,.18)}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#ff8fbe,#ff6aa8);color:#fff}
.btn-secondary{background:#fff;color:#7b5f70;border:1px solid #f0dbe5;box-shadow:0 6px 14px rgba(126,105,120,.08)}
.btn-fake{background:linear-gradient(135deg,#ffd3e6,#ffc2f0,#d7deff);color:#7a4871;transform-origin:center;animation:pulseBtn 2.1s ease-in-out infinite}
@keyframes pulseBtn{0%,100%{box-shadow:0 10px 18px rgba(255,127,179,.18)}50%{box-shadow:0 14px 28px rgba(140,112,255,.22)}}
.small-note{text-align:center;margin-top:12px;color:#aa91a0;font-size:12px}
.hidden{display:none !important}
.stepDots{display:flex;justify-content:center;gap:8px;margin:10px 0 0}
.stepDots span{width:8px;height:8px;border-radius:50%;background:#efd7e3;transition:all .25s ease}
.stepDots span.on{width:20px;border-radius:999px;background:#ff8ebb}
.endText{text-align:center;color:#826878;font-size:15px;line-height:1.75;margin:8px 10px 0}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;width:10px;height:14px;border-radius:2px;top:-20px;opacity:.85;animation:fall 4.2s linear infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg)}100%{transform:translateY(440px) rotate(380deg)}}
.shake{animation:shake .26s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-4px)}}
.fadeUp{animation:fadeUp .36s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.tearInfo{text-align:center;color:#9d8190;font-size:13px;margin:10px 0 0}
.overWrap{text-align:center;padding:2px 0 0}
.overTitle{font-size:25px;font-weight:900;margin:14px 0 8px}
.overSub{color:#8c7483;font-size:14px;line-height:1.7;margin:0 8px 14px}
.footerActions{display:flex;gap:10px;margin-top:12px}
.footerActions .btn{flex:1;padding:13px 10px;font-size:15px}
</style>
</head>

const intro = document.getElementById('intro');
const refuse = document.getElementById('refuse');
const happy = document.getElementById('happy');
const over = document.getElementById('over');
const heroImg = document.getElementById('heroImg');
const endingImg = document.getElementById('endingImg');
const refuseImg = document.getElementById('refuseImg');
const overImg = document.getElementById('overImg');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const trueBtn = document.getElementById('trueBtn');
const fakeBtn = document.getElementById('fakeBtn');
const secretFakeBtn = document.getElementById('secretFakeBtn');
const restartBtn1 = document.getElementById('restartBtn1');
const restartBtn2 = document.getElementById('restartBtn2');
const copyBtn = document.getElementById('copyBtn');
const tearInfo = document.getElementById('tearInfo');
const refuseTitle = document.getElementById('refuseTitle');
const refuseSub = document.getElementById('refuseSub');
const introDots = document.querySelectorAll('#introDots span');
const refuseDots = document.querySelectorAll('#refuseDots span');
const happyDots = document.querySelectorAll('#happyDots span');
const heroFrame = document.getElementById('heroFrame');
const refuseFrame = document.getElementById('refuseFrame');
const happyFrame = document.getElementById('happyFrame');

let introTimer = null, happyTimer = null;
let introIndex = 0;
let happyIndex = 0;
let refuseIndex = 0;
let answerText = '';

function showSection(el){[intro, refuse, happy, over].forEach(s=>s.classList.add('hidden')); el.classList.remove('hidden');}
function setDots(nodes, idx){nodes.forEach((n,i)=>n.classList.toggle('on', i===idx));}
function bump(frame){frame.classList.remove('pop'); void frame.offsetWidth; frame.classList.add('pop'); setTimeout(()=>frame.classList.remove('pop'), 430);}
function stopTimers(){clearInterval(introTimer); clearInterval(happyTimer);}
function startIntroCarousel(){
  stopTimers();
  introIndex = 0; heroImg.src = introImgs[0]; setDots(introDots,0);
  introTimer = setInterval(()=>{introIndex=(introIndex+1)%introImgs.length; heroImg.style.opacity='.18'; setTimeout(()=>{heroImg.src=introImgs[introIndex]; heroImg.style.opacity='1'; setDots(introDots,introIndex); bump(heroFrame);},140)},1900);
}
function startHappyCarousel(){
  stopTimers();
  happyIndex = 0; endingImg.src = happyImgs[0]; setDots(happyDots,0);
  happyTimer = setInterval(()=>{happyIndex=(happyIndex+1)%happyImgs.length; endingImg.style.opacity='.2'; setTimeout(()=>{endingImg.src=happyImgs[happyIndex]; endingImg.style.opacity='1'; setDots(happyDots,happyIndex); bump(happyFrame);},120)},1500);
}
function decorateStickers(){
  const icons = ['💗','✨','🌸','🫧','⭐','💞'];
  const box = document.getElementById('stickers');
  for(let i=0;i<16;i++){
    const s = document.createElement('div');
    s.className='sticker';
    s.textContent = icons[i%icons.length];
    s.style.left = (Math.random()*100)+'vw';
    s.style.bottom = (-10 - Math.random()*40)+'px';
    s.style.animationDuration = (10 + Math.random()*8)+'s';
    s.style.animationDelay = (-Math.random()*10)+'s';
    s.style.fontSize = (14 + Math.random()*12)+'px';
    box.appendChild(s);
  }
}
function decorateConfetti(){
  const colors=['#ff94c0','#ffd86f','#9fd2ff','#cbb2ff','#ffa7a7','#9af1cf'];
  const box=document.getElementById('confetti'); box.innerHTML='';
  for(let i=0;i<20;i++){
    const c=document.createElement('i');
    c.style.left=(Math.random()*100)+'%';
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(-Math.random()*4.2)+'s';
    c.style.animationDuration=(3.3+Math.random()*2.5)+'s';
    c.style.transform=`rotate(${Math.random()*180}deg)`;
    box.appendChild(c);
  }
}
function goHappy(){
  answerText = '我愿意和小羊成为朋友。';
  showSection(happy); startHappyCarousel(); decorateConfetti();
}
function updateRefuseView(){
  refuseImg.src = refuseImgs[refuseIndex];
  setDots(refuseDots, refuseIndex);
  tearInfo.textContent = `第 ${refuseIndex+1} 次确认`;
  refuseTitle.textContent = refuseIndex < refuseImgs.length-1 ? '真的不愿意吗？' : '那就到这里啦…';
  refuseSub.textContent = refuseIndex < refuseImgs.length-1 ? '小羊再认真确认一下下……' : '最后一次确认结束。';
  const scale = 1.06 + refuseIndex*0.16;
  const truescale = Math.max(0.86, 1 - refuseIndex*0.05);
  fakeBtn.style.transform = `scale(${scale})`;
  trueBtn.style.transform = `scale(${truescale})`;
  bump(refuseFrame);
}
function goRefuseStage(){
  if(refuse.classList.contains('hidden')){showSection(refuse); refuseIndex=0; updateRefuseView();}
  else {
    if(refuseIndex < refuseImgs.length-1){refuseIndex++; updateRefuseView();}
    else {answerText = '我现在暂时不想和小羊成为朋友。'; overImg.src = refuseImgs[refuseImgs.length-1]; showSection(over); stopTimers();}
  }
}

noBtn.addEventListener('click', ()=>{goRefuseStage(); noBtn.classList.add('shake'); setTimeout(()=>noBtn.classList.remove('shake'),260);});
yesBtn.addEventListener('click', goHappy);
trueBtn.addEventListener('click', ()=>{goRefuseStage(); trueBtn.classList.add('shake'); setTimeout(()=>trueBtn.classList.remove('shake'),260);});
fakeBtn.addEventListener('click', goHappy);
secretFakeBtn.addEventListener('click', goHappy);
restartBtn1.addEventListener('click', ()=>{showSection(intro); startIntroCarousel();});
restartBtn2.addEventListener('click', ()=>{fakeBtn.style.transform='scale(1.06)'; trueBtn.style.transform='scale(1)'; showSection(intro); startIntroCarousel();});
copyBtn.addEventListener('click', async ()=>{
  try{await navigator.clipboard.writeText(answerText || '我愿意和小羊成为朋友。'); alert('已复制～');}
  catch(e){alert('复制失败了，不过答案已经很明确啦 💗');}
});

decorateStickers();
startIntroCarousel();
</script>
